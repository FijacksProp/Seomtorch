{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Monitor{% endblock %} · Seomtorch</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'monitor/monitor.css' %}"></head>
<body><div class="monitor-layout"><aside class="monitor-sidebar"><a class="monitor-brand" href="{% url 'monitor:dashboard' %}"><span class="monitor-mark"><i></i><i></i><i></i></span><span>Seomtorch<small>Monitoring centre</small></span></a><nav><a class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'monitor:dashboard' %}"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4ZM14 20h6v-9h-6ZM4 20h6v-3H4ZM14 7h6V4h-6Z"/></svg>Overview</a><a class="{% if 'student' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'monitor:students' %}"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2.5 21v-2a6.5 6.5 0 0 1 13 0v2M16 4.5a4 4 0 0 1 0 7.5M18 15a6 6 0 0 1 3.5 5.5"/></svg>Students</a><a class="{% if request.resolver_match.url_name == 'flags' %}active{% endif %}" href="{% url 'monitor:flags' %}"><svg viewBox="0 0 24 24"><path d="M5 3v18M5 3l9 4.5L5 12l9 4.5"/></svg>Flags</a><a href="/internal-admin/"><svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7Z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg>Content admin</a></nav><div class="sidebar-account"><span>{{ request.user.username }}</span><small>Administrator</small><form method="post" action="{% url 'monitor:logout' %}">{% csrf_token %}<button>Sign out</button></form></div></aside><main><header class="monitor-top"><div><span class="status-dot"></span>System online</div><div><a href="/internal-admin/learning/question/add/">Add question</a> <a href="{% url 'monitor:export-csv' %}">Export CSV</a></div></header><div class="monitor-page">{% block content %}{% endblock %}</div></main></div></body></html>

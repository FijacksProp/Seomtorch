<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Partner dashboard{% endblock %} · Seomtorch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#064d3b;--green-dark:#073d31;--paper:#f5f2e9;--white:#fffefa;--ink:#1b2822;--muted:#69766e;--line:#e1e5dc;--gold:#d69531;--red:#a83f36}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 "DM Sans",sans-serif}header{background:var(--green-dark);color:#fff;padding:18px clamp(18px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand-mark{width:38px;height:38px;border-radius:11px;background:#eff5ee;color:var(--green);display:grid;place-items:center;font-weight:700}.brand strong{font:600 17px "Newsreader",serif;letter-spacing:.01em}.brand small{display:block;color:#bfd4c9;font-size:9px;letter-spacing:.15em;text-transform:uppercase}.head-actions{display:flex;align-items:center;gap:14px}.head-actions a{color:#d5e3dc;text-decoration:none;font-size:12px}.head-actions button{border:1px solid rgba(255,255,255,.3);border-radius:8px;background:transparent;color:#fff;padding:8px 12px;font:600 11px "DM Sans",sans-serif;cursor:pointer}.wrap{width:min(1180px,calc(100% - 36px));margin:34px auto 70px}.eyebrow{margin:0 0 8px;color:var(--green);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1,h2{font-family:"Newsreader",serif;font-weight:600}h1{font-size:clamp(30px,4vw,44px);line-height:1.06;margin-bottom:9px}h2{font-size:24px;margin-bottom:7px}h3{font-size:14px}.lede{color:var(--muted);max-width:680px;margin:0 0 28px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.stat,.panel{background:var(--white);border:1px solid var(--line);border-radius:13px}.stat{padding:18px}.stat strong{display:block;font:600 30px "Newsreader",serif}.stat span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.panel{padding:22px}.panel-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-head p{margin:0;color:var(--muted);font-size:11px}.course-row{padding:11px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px}.course-row:first-of-type{border-top:0}.course-row small{display:block;color:var(--muted);font-size:10px}.course-row b{color:var(--green)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th{text-align:left;color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px}td strong{display:block}td small{display:block;color:var(--muted);font-size:10px}.student-detail{min-width:230px}.student-detail summary{cursor:pointer;color:var(--green);font-size:11px;font-weight:700}.student-detail ul{padding-left:15px;color:var(--muted);font-size:10px}.student-detail li{margin:5px 0}.pill{display:inline-block;padding:4px 8px;background:#edf4ee;border-radius:20px;color:var(--green);font-size:10px;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.messages{margin-bottom:18px}.message{padding:10px 13px;border-radius:8px;background:#edf4ee;color:var(--green);font-size:12px}.message.error{background:#fff0ee;color:var(--red)}.org-switch{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.org-switch a{border:1px solid var(--line);border-radius:20px;padding:7px 12px;background:var(--white);color:var(--ink);text-decoration:none;font-size:11px}.org-switch a.active{background:var(--green);border-color:var(--green);color:#fff}.pagination{display:flex;justify-content:space-between;align-items:center;padding-top:14px;color:var(--muted);font-size:11px}.pagination a{color:var(--green);text-decoration:none;font-weight:700}
    @media(max-width:720px){header{align-items:flex-start}.head-actions a{display:none}.wrap{width:calc(100% - 24px);margin-top:22px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:25px}.panel{padding:16px}.head-actions button{padding:7px 9px}}
    @media(max-width:390px){.stats{grid-template-columns:1fr}.stat{display:flex;align-items:center;justify-content:space-between}.stat strong{font-size:23px}}
  </style>
</head>
<body>
  <header><a class="brand" href="{% url 'partner:dashboard' %}"><span class="brand-mark" aria-hidden="true">S</span><span><strong>Seomtorch</strong><small>Partner insight portal</small></span></a><div class="head-actions">{% if request.user.is_authenticated %}<a href="{% url 'partner:dashboard' %}">Partner dashboard</a><form method="post" action="{% url 'partner:logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>{% endif %}</div></header>
  <main class="wrap">{% if messages %}<div class="messages">{% for message in messages %}<div class="message {% if message.tags == 'error' %}error{% endif %}">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main>
</body>
</html>

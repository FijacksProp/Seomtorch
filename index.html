<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#064d3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Seomtorch">
  <meta name="description" content="Seomtorch is a focused, offline-first exam preparation companion for Nigerian students.">
  <title>Seomtorch — Prepare with purpose</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/seomtorch_logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/seomtorch_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="ambient-scene" aria-hidden="true">
    <span class="ambient-wash wash-ochre"></span>
    <span class="ambient-wash wash-forest"></span>
    <span class="ambient-sweep"></span>
    <span class="ambient-orbit orbit-one"></span>
    <span class="ambient-orbit orbit-two"></span>
  </div>
  <div id="app-loader" class="app-loader" role="status" aria-live="polite" aria-label="Preparing Seomtorch">
    <div class="loader-composition">
      <div class="loader-emblem" aria-hidden="true">
        <span class="loader-halo"></span>
        <span class="loader-logo-frame"><img src="assets/seomtorch_logo.png" alt=""></span>
      </div>
      <div class="loader-copy">
        <span>Focused preparation</span>
        <strong>Seomtorch</strong>
        <p>Opening your study space</p>
      </div>
      <div class="loader-rule" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script>window.__seomtorchLoaderFailsafe = window.setTimeout(function () { var loader = document.getElementById("app-loader"); if (!loader) return; loader.classList.add("dismissed"); window.setTimeout(function () { if (loader.parentNode) loader.remove(); }, 700); }, 5000);</script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
